name: truncate
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core ML / model serving
      - vllm==0.12.0
      - torch==2.9.0
      - transformers==4.57.3
      - peft
      - datasets
      # Statistics
      - numpy
      - scipy
      - statsmodels
      - sympy
      - pylatexenc
      # NLP / evaluation
      - nltk
      - rouge-score
      # Plotting
      - matplotlib
      - seaborn
      # Progress bar
      - tqdm
      # API clients for closed-source models and dataset-construction judges
      - openai
      - anthropic
      - google-genai
